<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>설명 영상</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#ddd;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
main{min-height:100vh;display:flex;align-items:center;justify-content:center}
video{display:block;width:100%;max-height:100vh;background:#000}
.wait{font-size:15px;letter-spacing:.05em;color:#999;padding:24px;text-align:center}
</style>
</head><body>
<main id="app"></main>
<script>
// 영상 교체: 이 폴더의 video.mp4 를 같은 이름으로 덮어쓰고 배포하면 같은 링크에 반영된다. 파일이 없으면 '준비 중' 문구.
(function(){
var app=document.getElementById('app');
var v=document.createElement('video');
v.controls=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.preload='metadata';
v.setAttribute('controlsList','nodownload noplaybackrate');v.disablePictureInPicture=true;
v.addEventListener('error',function(){app.innerHTML='<div class="wait">영상 준비 중입니다</div>'});
v.src='video.mp4?v=0#t=0.1';app.appendChild(v);
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('dragstart',function(e){e.preventDefault()});
})();
</script>
</body></html>
